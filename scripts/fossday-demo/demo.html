<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Space+Grotesk:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=block" rel="stylesheet">
<style>
  :root { --navy:#10163A; --ink:#0B1028; --cream:#F4EFE3; --amber:#F2C46D; --teal:#7FD8D4; --brick:#D9644A; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--ink); color:var(--cream); }
  .mono { font-family:'JetBrains Mono', monospace; font-variant-ligatures:none; }
  .disp { font-family:'Space Grotesk', sans-serif; letter-spacing:-0.03em; }
  .sans { font-family:'IBM Plex Sans', sans-serif; }
  .abs { position:absolute; }
  .dim { color:rgb(244 239 227 / .45); }
  .faint { color:rgb(244 239 227 / .28); }
  .teal { color:var(--teal); } .amber { color:var(--amber); } .brick { color:var(--brick); }
  .win { position:absolute; background:var(--navy); border:1px solid rgb(244 239 227 / .12); border-radius:8px; overflow:hidden; }
  .bar { height:52px; display:flex; align-items:center; padding:0 26px; border-bottom:1px solid rgb(244 239 227 / .1); font-size:20px; color:rgb(244 239 227 / .45); }
  .grid { position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgb(244 239 227 / .05) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(244 239 227 / .05) 1px, transparent 1px);
    background-size:40px 40px; }
  .cursor { display:inline-block; width:.58em; height:1.08em; vertical-align:-.16em; background:var(--cream); margin-left:2px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (h) => h;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = (x) => 1 - Math.pow(1 - x, 3);
const typed = (s, t, t0, cps = 26) => s.slice(0, Math.max(0, Math.floor((t - t0) * cps)));
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const SPIN = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏';
const spin = (t) => SPIN[Math.floor(t * 12) % SPIN.length];

/* Scene windows, in video seconds. */
const SC = [
  { key: 'push',     a: 0,  b: 14 },
  { key: 'pipeline', a: 14, b: 43 },
  { key: 'registry', a: 43, b: 53 },
  { key: 'rollout',  a: 53, b: 75 },
  { key: 'verify',   a: 75, b: 87 },
];
const sceneOpacity = (t, s) => {
  const fin = s.a === 0 ? 1 : prog(t, s.a, s.a + 0.45);
  const fout = s.b >= 87 ? 1 : 1 - prog(t, s.b - 0.45, s.b);
  return Math.min(fin, fout);
};

/* Video time → wall-clock time the real run took (piecewise linear). */
const REAL = [[0, 0], [14, 9], [43, 200], [53, 211], [75, 266], [87, 277]];
function realClock(t) {
  for (let i = 1; i < REAL.length; i++) {
    const [t0, r0] = REAL[i - 1], [t1, r1] = REAL[i];
    if (t <= t1) { const r = r0 + (r1 - r0) * prog(t, t0, t1); return `${Math.floor(r / 60)}:${String(Math.floor(r % 60)).padStart(2, '0')}`; }
  }
  return '4:37';
}

function header(t) {
  const cur = SC.findIndex((s) => t >= s.a && t < s.b);
  const steps = SC.map((s, i) => {
    const c = i === cur ? 'var(--amber)' : i < cur ? 'rgb(244 239 227 / .7)' : 'rgb(244 239 227 / .28)';
    const dot = i < cur ? '■' : i === cur ? '■' : '□';
    return `<span style="color:${c}">${dot} ${s.key}</span>`;
  }).join('<span class="faint" style="margin:0 18px">──</span>');
  return `
  <div class="abs mono" style="left:0;right:0;top:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;border-bottom:1px solid rgb(244 239 227 / .1);font-size:22px;background:var(--ink)">
    <span><span class="amber">avatar-service</span> <span class="dim">· deploy v2</span></span>
    <span>${steps}</span>
    <span class="dim">rekonstruksi alur · waktu nyata <span class="amber">${realClock(t)}</span></span>
  </div>`;
}

/* ── Scene 1 · push ─────────────────────────────────────────────────────── */
function sPush(t) {
  const P = '<span class="teal">~/avatar-service</span> <span class="dim">(main)</span> <span class="amber">$</span> ';
  const out = [];
  const cmd = (s, t0, cps = 26) => {
    if (t < t0) return false;
    const txt = typed(s, t, t0, cps);
    out.push(P + esc(txt) + (txt.length < s.length ? '<span class="cursor"></span>' : ''));
    return txt.length >= s.length;
  };
  const line = (html, at) => { if (t >= at) out.push(html); };

  cmd('git status -s', 0.6);
  line('<span class="brick"> M</span> src/routes/avatar.ts', 1.6);
  line('<span class="brick"> M</span> src/lib/image.ts', 1.7);
  line('<span class="teal">??</span> test/avatar.test.ts', 1.8);
  cmd('git add -A && git commit -m "feat(avatar): upload + resize 3 ukuran"', 2.8, 32);
  line('<span class="dim">[main 7f3b1d0]</span> feat(avatar): upload + resize 3 ukuran', 5.4);
  line('<span class="dim"> 3 files changed, 193 insertions(+), 4 deletions(-)</span>', 5.5);
  cmd('git push origin main', 6.8);
  line('<span class="dim">Enumerating objects: 14, done.</span>', 8.0);
  line('<span class="dim">Counting objects: 100% (14/14), done.</span>', 8.3);
  line('<span class="dim">Writing objects: 100% (8/8), 2.91 KiB | 2.91 MiB/s, done.</span>', 8.8);
  line('<span class="dim">To forge.local:aidil/avatar-service.git</span>', 9.2);
  line('<span class="teal">   a41c9e2..7f3b1d0  main -&gt; main</span>', 9.5);
  line('', 10.6);
  line('<span class="amber">webhook → pipeline #482 dipicu</span>', 10.8);
  const idle = t > 10.8 ? P + '<span class="cursor"></span>' : (t < 0.6 ? P + '<span class="cursor"></span>' : '');
  return `
  <div class="win mono" style="left:120px;top:150px;width:1680px;height:840px;background:var(--ink)">
    <div class="bar">bash — ~/avatar-service</div>
    <div style="padding:34px 40px;font-size:28px;line-height:1.62;white-space:pre">${out.join('\n')}${idle ? '\n' + idle : ''}</div>
  </div>`;
}

/* ── Scene 2 · pipeline ─────────────────────────────────────────────────── */
const STAGES = [
  ['checkout', 14.6, 15.6, 3,  ['git fetch origin 7f3b1d0', 'HEAD is now at 7f3b1d0 feat(avatar): upload + resize 3 ukuran']],
  ['install',  15.6, 18.0, 21, ['pnpm install --frozen-lockfile', 'Lockfile is up to date, resolution step is skipped', 'Packages: +412', 'Done in 19.8s']],
  ['lint',     18.0, 19.6, 9,  ['eslint . --max-warnings 0', 'tsc --noEmit', '<span class="teal">✓ no problems</span>']],
  ['test',     19.6, 25.6, 38, ['vitest run',
      '<span class="teal"> ✓</span> avatar › tolak file &gt; 5 MB <span class="dim">(413)</span>',
      '<span class="teal"> ✓</span> avatar › tolak .php berkedok .jpg <span class="dim">(415)</span>',
      '<span class="teal"> ✓</span> avatar › hapus EXIF &amp; GPS',
      '<span class="teal"> ✓</span> avatar › resize 512 · 256 · 128',
      '<span class="teal"> ✓</span> avatar › buat thumbnail 128px',
      '<span class="teal"> ✓</span> storage › nama file dari hash konten',
      '<span class="dim"> … 17 test lain</span>',
      '<span class="teal"> Tests  23 passed (23)</span>']],
  ['scan',     25.6, 29.6, 27, ['trivy fs --severity HIGH,CRITICAL .', '347 paket diperiksa', 'CRITICAL: 0   HIGH: 0', '<span class="teal">✓ lolos kebijakan</span>']],
  ['sbom',     29.6, 31.2, 6,  ['syft . -o spdx-json &gt; sbom.spdx.json', '<span class="teal">✓ 347 komponen tercatat</span>']],
  ['build',    31.2, 37.6, 71, ['docker build -t registry.local/avatar:v2 .',
      '[build 1/6] FROM node:22', '[build 4/6] RUN pnpm install --frozen-lockfile', '[build 6/6] RUN pnpm build &amp;&amp; pnpm prune --prod',
      '[stage-1 1/3] FROM distroless/nodejs22-debian12', '[stage-1 3/3] COPY --from=build /app/node_modules ./node_modules',
      'exporting layers', '<span class="teal">✓ avatar:v2 · 180 MB</span>']],
  ['sign',     37.6, 39.2, 4,  ['cosign sign registry.local/avatar:v2', '<span class="teal">✓ tlog entry dibuat</span>']],
  ['push',     39.2, 41.4, 12, ['docker push registry.local/avatar:v2', 'v2: digest: sha256:9c1e…4b7a size: 1784', '<span class="teal">✓ pushed</span>']],
];

function sPipeline(t) {
  const cur = STAGES.findIndex(([, a, b]) => t >= a && t < b);
  const done = t >= 41.4;
  const rows = STAGES.map(([name, a, b, real], i) => {
    let icon, col, dur = '';
    if (t >= b) { icon = '<span class="teal">✓</span>'; col = 'rgb(244 239 227 / .85)'; dur = `${real}s`; }
    else if (t >= a) { icon = `<span class="amber">${spin(t)}</span>`; col = 'var(--amber)'; dur = `${Math.floor(real * prog(t, a, b))}s`; }
    else { icon = '<span class="faint">○</span>'; col = 'rgb(244 239 227 / .3)'; }
    const bg = i === cur ? 'background:rgb(242 196 109 / .08);' : '';
    return `<div style="display:flex;justify-content:space-between;align-items:center;height:62px;padding:0 30px;${bg}border-bottom:1px solid rgb(244 239 227 / .06)">
      <span style="color:${col}">${icon}&nbsp;&nbsp;${name}</span><span class="dim">${dur}</span></div>`;
  }).join('');

  const show = cur >= 0 ? cur : (done ? STAGES.length - 1 : 0);
  const [name, a, b, , logs] = STAGES[show];
  const n = done || t >= b ? logs.length : Math.max(1, Math.ceil(logs.length * prog(t, a, b - 0.25)));
  const logHtml = logs.slice(0, n).map((l, i) => (i === 0 ? `<span class="dim">$ </span>${l}` : l)).join('\n');

  const total = STAGES.reduce((s, [, a, b, real]) => s + (t >= b ? real : t >= a ? real * prog(t, a, b) : 0), 0);
  const status = done
    ? '<span class="teal">● pipeline lulus</span>'
    : '<span class="amber">● berjalan</span>';

  return `
  <div class="abs mono" style="left:120px;top:122px;font-size:24px" >
    <span class="dim">pipeline</span> <span class="amber">#482</span> <span class="dim">· main · 7f3b1d0 · dipicu oleh push</span>
  </div>
  <div class="win mono" style="left:120px;top:180px;width:560px;height:700px">
    <div class="bar">stages</div>
    <div style="font-size:27px">${rows}</div>
  </div>
  <div class="win mono" style="left:720px;top:180px;width:1080px;height:700px;background:var(--ink)">
    <div class="bar">job · ${name}</div>
    <div style="padding:30px 36px;font-size:26px;line-height:1.7;white-space:pre">${logHtml}</div>
  </div>
  <div class="abs mono" style="left:120px;top:910px;right:120px;display:flex;justify-content:space-between;font-size:26px">
    <span>${status}</span>
    <span class="dim">durasi ${Math.floor(total / 60)}m ${String(Math.floor(total % 60)).padStart(2, '0')}s</span>
  </div>`;
}

/* ── Scene 3 · registry ─────────────────────────────────────────────────── */
function sRegistry(t) {
  const rows = [
    ['digest', 'sha256:9c1e…4b7a', 44.2],
    ['ukuran', '180 MB · 4 layer', 44.6],
    ['signature', '<span class="teal">✓ cosign · terverifikasi</span>', 45.2],
    ['SBOM', '<span class="teal">✓ terlampir · 347 komponen</span>', 45.8],
    ['scan', '<span class="teal">✓ 0 critical · 0 high</span>', 46.4],
  ].map(([k, v, at]) => `<div style="display:grid;grid-template-columns:240px 1fr;padding:18px 0;border-bottom:1px solid rgb(244 239 227 / .08);opacity:${prog(t, at, at + .35)}">
      <span class="dim">${k}</span><span>${v}</span></div>`).join('');
  const sync = prog(t, 48.4, 48.8);
  return `
  <div class="abs" style="left:120px;top:150px">
    <div class="mono dim" style="font-size:22px">registry.local / avatar</div>
  </div>
  <div class="win mono" style="left:120px;top:210px;width:1680px;height:560px">
    <div style="display:flex;align-items:baseline;gap:28px;padding:36px 44px 20px">
      <span class="disp" style="font-size:96px;font-weight:500">avatar:<span class="amber">v2</span></span>
      <span style="font-size:20px;padding:4px 12px;border:1px solid var(--amber);color:var(--amber)">baru · ${Math.max(0, Math.floor((t - 43) * 2))} detik lalu</span>
      <span class="faint" style="margin-left:auto;font-size:22px">avatar:v1 · 6 hari lalu</span>
    </div>
    <div style="padding:0 44px;font-size:26px">${rows}</div>
  </div>
  <div class="abs mono" style="left:120px;top:820px;font-size:26px;opacity:${sync}">
    <span class="dim">gitops ▸</span> deploy/avatar  image: avatar:v1 <span class="amber">→ avatar:v2</span>  <span class="dim">· sync dimulai</span>
  </div>`;
}

/* ── Scene 4 · rollout ──────────────────────────────────────────────────── */
const R0 = 54.5, STEP = 5.6;
const ids = { v1: ['7f9c', 'b21d', 'e04a'], v2: ['k2m8', 'p4x1', 'q9tz'] };
function podState(t, k) {
  const s = R0 + k * STEP;
  const nw = t < s ? null : t < s + 1.1 ? 'Pending' : t < s + 2.3 ? 'ContainerCreating' : t < s + 3.6 ? 'Running · probe…' : 'Ready';
  const old = t < s + 3.8 ? 'Ready' : t < s + 5.0 ? 'Terminating' : null;
  return { nw, old };
}
function podCard(ver, id, state, t) {
  if (!state) return `<div style="height:170px;border:1px dashed rgb(244 239 227 / .12);border-radius:6px"></div>`;
  const ready = state === 'Ready';
  const term = state === 'Terminating';
  const c = ver === 'v2' ? 'var(--teal)' : 'rgb(244 239 227 / .55)';
  const dot = ready ? c : term ? 'var(--brick)' : 'var(--amber)';
  return `<div style="height:170px;border:1.5px solid ${ready ? c : 'rgb(244 239 227 / .2)'};border-radius:6px;padding:20px 24px;opacity:${term ? .55 : 1};position:relative">
    <div class="mono dim" style="font-size:17px">avatar-${id}</div>
    <div class="disp" style="font-size:64px;font-weight:500;color:${c};line-height:1.1">${ver}</div>
    <div class="mono" style="position:absolute;left:24px;bottom:16px;font-size:17px;display:flex;align-items:center;gap:10px">
      <span style="width:10px;height:10px;border-radius:50%;background:${dot};display:inline-block"></span>
      <span style="color:${term ? 'var(--brick)' : ready ? 'rgb(244 239 227 / .8)' : 'var(--amber)'}">${state === 'Ready' ? 'Ready' : esc(state)}${!ready && !term ? ' ' + spin(t) : ''}</span>
    </div></div>`;
}
function sRollout(t) {
  const P = '<span class="amber">$</span> ';
  const cmd = 'kubectl rollout status deploy/avatar';
  const lines = [P + typed(cmd, t, 53.4, 30)];
  const add = (h, at) => { if (t >= at) lines.push(h); };
  for (let k = 0; k < 3; k++) add(`<span class="dim">Waiting for rollout: ${k + 1} of 3 new replicas updated…</span>`, R0 + k * STEP + 0.2);
  add('<span class="dim">Waiting for rollout: 1 old replica pending termination…</span>', R0 + 2 * STEP + 3.9);
  add('<span class="teal">deployment "avatar" successfully rolled out</span>', R0 + 2 * STEP + 5.1);

  const st = [0, 1, 2].map((k) => podState(t, k));
  const v2r = st.filter((s) => s.nw === 'Ready').length;
  const v1r = st.filter((s) => s.old === 'Ready').length;
  const share = v2r / Math.max(1, v1r + v2r);

  return `
  <div class="win mono" style="left:120px;top:150px;width:820px;height:780px;background:var(--ink)">
    <div class="bar">bash — kubectl</div>
    <div style="padding:30px 34px;font-size:24px;line-height:1.75;white-space:pre-wrap">${lines.join('\n')}</div>
  </div>
  <div class="abs" style="left:1000px;top:150px;width:800px">
    <div class="mono dim" style="font-size:18px;letter-spacing:.14em;text-transform:uppercase">pod · v1</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:16px">
      ${st.map((s, k) => podCard('v1', ids.v1[k], s.old, t)).join('')}
    </div>
    <div class="mono teal" style="font-size:18px;letter-spacing:.14em;text-transform:uppercase;margin-top:44px">pod · v2</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:16px">
      ${st.map((s, k) => podCard('v2', ids.v2[k], s.nw, t)).join('')}
    </div>
    <div class="mono" style="margin-top:48px;font-size:19px;display:flex;justify-content:space-between">
      <span class="dim">trafik ke v2</span><span class="teal">${Math.round(share * 100)}%</span>
    </div>
    <div style="margin-top:12px;height:8px;background:rgb(244 239 227 / .1)">
      <div style="height:100%;width:${share * 100}%;background:var(--teal)"></div>
    </div>
    <div class="mono dim" style="margin-top:22px;font-size:17px">maxUnavailable: 0 · trafik hanya ke pod yang Ready</div>
  </div>`;
}

/* ── Scene 5 · verify ───────────────────────────────────────────────────── */
function sVerify(t) {
  const P = '<span class="amber">$</span> ';
  const cmd = 'curl -s -F "file=@foto-profil.jpg" https://avatar.local/api/avatar | jq';
  const lines = [P + esc(typed(cmd, t, 75.6, 34))];
  const json = [
    '{',
    '  <span class="teal">"status"</span>: 201,',
    '  <span class="teal">"sizes"</span>: [512, 256, 128],',
    '  <span class="teal">"format"</span>: "webp",',
    '  <span class="teal">"exif"</span>: "stripped",',
    '  <span class="teal">"version"</span>: "v2"',
    '}',
  ];
  json.forEach((j, i) => { if (t >= 78.2 + i * 0.12) lines.push(j); });
  const end = ease(prog(t, 80.6, 81.6));
  return `
  <div class="win mono" style="left:120px;top:150px;width:1680px;height:520px;background:var(--ink)">
    <div class="bar">bash — verifikasi</div>
    <div style="padding:30px 40px;font-size:25px;line-height:1.6;white-space:pre">${lines.join('\n')}</div>
  </div>
  <div class="abs" style="left:120px;top:${740 + (1 - end) * 20}px;opacity:${end}">
    <div class="mono teal" style="font-size:72px">✓ deployed to production</div>
    <div class="mono dim" style="font-size:26px;margin-top:14px">push → production · <span class="amber">4m 37s</span> · tanpa downtime</div>
  </div>`;
}

const RENDER = { push: sPush, pipeline: sPipeline, registry: sRegistry, rollout: sRollout, verify: sVerify };

window.seek = (t) => {
  const scenes = SC.map((s) => {
    const o = sceneOpacity(t, s);
    if (o <= 0 || t < s.a - 0.01 || t > s.b + 0.01) return '';
    return `<div class="abs" style="inset:0;opacity:${o}">${RENDER[s.key](t)}</div>`;
  }).join('');
  document.getElementById('app').innerHTML = `<div class="grid"></div>${scenes}${header(t)}`;
};
window.DURATION = 87;
window.seek(0);
</script>
</body>
</html>
